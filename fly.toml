# Fly.io config for the single-origin Posterboy app.
# NOTE: `app` must be globally unique across Fly — change it to your own name
# (e.g. posterboy-<yourhandle>) before `fly launch`/`fly deploy`.
app = "posterboy"
primary_region = "iad"  # change to a region near you: `fly platform regions`

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true            # redirect http -> https; required for Secure cookies
  # Cost-saving: stop the machine when idle, cold-start it on the next request.
  # First hit after idle is a little slow (Chromium image); set
  # min_machines_running = 1 if you want it always warm.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"        # allow Chromium + table create on boot
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                # Chromium (Playwright) needs the headroom
